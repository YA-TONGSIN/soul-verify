        "0.5": "베이킹 연습은 맞히지만 잡담 속 정보(예: 러닝 시작, 7:30 기상)를 민서의 현재 선호처럼 말함"
        "0": "베이킹 연습을 말하지 못하거나 다른 일정을 지어냄"
    trap: "질문이 긴 잡담 끝에 있고, 잡담에 옛 선호·남의 선호 미끼가 여럿 들어 있다."

