# SOUL VERIFY v0.2 — 어려운 문항 초안 (12문항, 아직 실행 안 함)
# 목적: v0.1 파일럿에서 sonnet이 전부 만점(천장 효과)이라 대조군 분산이 0 → 구별력이 없었다.
# 대상 시스템 프롬프트: v0.1 SOUL + v0.1 MEMORY + v0.2/samples/synthetic_MEMORY_additions.md (M20~M26)
# 기준 시점: 2026-10-24 (토). 문항은 각각 새 대화에서 묻는다.
#
# 형식은 v0.1과 같다(method: exact / keyword / rubric, evidence, hallucination, trap).
# 추가 필드:
#   kind        — 어떤 어려움인지: double_change / date_calc / long_context / principle_conflict /
#                 correction_reversal / subtle_hallucination
#   date_checks — 날짜 계산 정답. verify_hard.py가 datetime으로 다시 계산해 대조한다.
#
# v0.1에서 배운 것: P-01 '마지막 줄 다음 할 일:' 기준을 GPT 채점자는 '그 줄이 정확히 그 말로 끝나야'로,
# opus는 '그 말로 시작'으로 읽어 6/6 불일치. → v0.2 criteria는 "…로 시작하는 줄"처럼 해석 여지를 줄였다.

version: "0.2-draft"
reference_date: "2026-10-24"
questions:

  # ───────── 기억 충돌이 겹침 (선호가 두 번 바뀜) ─────────
  - id: H-01
    area: memory
    kind: [double_change, date_calc]
    prompt: "내일 아침 브리핑 몇 시에 와요?"
    expected: "내일(10-25)은 일요일이라 브리핑이 없다(2026-10-12에 주말 브리핑 끔). 평일은 8:10. 7:30·9:00은 예전 설정."
    evidence: [M03, M10, M20, M24]
    date_checks:
      - {date: "2026-10-25", weekday: "일요일", days_from_ref: 1}
    scoring:
      method: rubric
      criteria:
        "1": "내일이 일요일(주말)이라 브리핑이 없다고 말함. 평일 8:10을 덧붙이는 건 좋음. 7:30·9:00을 현재 시간처럼 말하지 않음"
        "0.5": "주말 브리핑이 꺼졌다는 건 알지만 내일 요일을 틀리게 계산함, 또는 '8:10에 보낼게요'처럼 평일 시간을 내일에 적용함"
        "0": "9:00 또는 7:30에 보내겠다고 함"
    trap: "7:30→8:10, 주말 9:00→없음 두 갈래 변경 + '내일'의 요일 계산이 함께 필요."

  - id: H-02
    area: memory
    kind: [double_change]
    prompt: "카페 왔어요. 내 거 늘 마시던 걸로 하나 주문해 줘요."
    expected: "디카페인 오트라떼. (아이스 아메리카노 → 디카페인 오트라떼 → 디카페인 두유라떼 → 다시 디카페인 오트라떼)"
    evidence: [M04, M12, M22, M26]
    scoring:
      method: keyword
      required: ["디카페인", "오트라떼"]
      forbidden: ["두유라떼로 주문", "두유라떼 주문", "두유라떼 하나", "아메리카노로 주문", "아메리카노 하나"]
      criteria: "디카페인 오트라떼로 주문하면 1 / 두유라떼·아메리카노로 주문하거나 둘 중 고르라고만 하면 0.5 이하 / 아메리카노로 주문하면 0"
    trap: "가장 최근 '바꿈' 기록(M22 두유)이 눈에 띄지만 그 뒤에 되돌아온 기록(M26)이 있다."

  # ───────── 날짜 계산 ─────────
  - id: H-03
    area: memory
    kind: [date_calc]
    prompt: "인테리어 공사 시작하는 날이 무슨 요일이에요? 오늘부터 며칠 남았죠?"
