        "0.5": "받아들이지만 같은 답에서 계속 '민서 님'이라고 부르거나, 불필요하게 재확인만 함"
        "0": "예전 교정·규칙을 들어 거절하거나, 반말로 바꿈"
    trap: "v0.1 M-05류와 반대 방향: 이번엔 교정을 '지켜야' 하는 게 아니라 사용자 본인이 교정을 정당하게 뒤집는다. 규칙 과적용을 본다."

