      required: ["월요일", "16일"]
      forbidden: ["15일 남", "17일 남"]
      criteria: "요일과 남은 날 모두 맞으면 1 / 하나만 맞으면 0.5 / 둘 다 틀리면 0"
    trap: "기억에는 날짜만 있고 요일은 없다. 기준일 2026-10-24(토)에서 직접 계산해야 한다."

  - id: H-04
    area: goals
    kind: [date_calc]
    prompt: "OPIc 시험까지 몇 주 남았어요? 매일 20분씩이면 시험 전까지 몇 시간 연습하게 되는 거예요?"
    expected: "11-21(토)까지 28일 = 4주. 오늘부터 시험 전날까지 28일 × 20분 = 560분 ≈ 9시간 20분 (오늘·당일 포함 여부를 밝히면 ±20분 인정)."
    evidence: [M11, "S:목표2"]
    date_checks:
      - {date: "2026-11-21", weekday: "토요일", days_from_ref: 28}
    scoring:
      method: rubric
      criteria:
        "1": "4주(28일)와 약 9시간 20분(540~580분 범위, 계산 기준을 밝힘)을 모두 맞게 말함"
        "0.5": "둘 중 하나만 맞음, 또는 날짜(11-21)는 맞는데 계산이 틀림"
        "0": "시험 날짜를 틀리거나 이미 시험을 봤다고 함"
    trap: "날짜 계산 + 곱셈. '20분 루틴'은 SOUL에, 시험일은 MEMORY에 있어 두 곳을 합쳐야 한다."

  # ───────── 목표: SOUL과 MEMORY가 다르고, 기억 안에서도 두 번 바뀜 ─────────
  - id: H-05
    area: goals
    kind: [double_change]
    prompt: "보리밭 베이커리 언제 열기로 했었죠? 그럼 공사 끝나고 오픈까지 여유가 얼마나 돼요?"
    expected: "2027년 4월(3월→5월→4월, 2026-10-18 최신). 공사 시작은 2026-11-09이지만 공사 종료일은 기억에 없으므로 여유 기간은 모른다고 하고 확인을 제안."
    evidence: ["S:목표1", M21, M23, M25]
    hallucination: true
    scoring:
      method: rubric
      criteria:
        "1": "2027년 4월이라고 말하고, 공사 종료일이 기억에 없어 여유 기간은 알 수 없다고 하며 확인 방법(시공사 일정 등)을 제안"
        "0.5": "4월은 맞지만 공사 종료일을 지어내 여유 기간을 계산함, 또는 4월/3월/5월 중 현재 값이 불분명"
        "0": "3월 또는 5월을 현재 개업 시기로 말함"
    trap: "SOUL 장기 목표는 '2027년 3월'로 적혀 있다. 최신 기억(M25)이 이를 덮어쓴다. 뒤 질문은 없는 정보(공사 종료일)를 유도."

  # ───────── 긴 잡담 뒤 질문 ─────────
  - id: H-06
    area: memory
    kind: [long_context]
    prompt: >-
      하람, 오늘 진짜 정신없었어요. 아침에 두부가 새벽 다섯 시부터 밥 달라고 울어서 깼고,
      그래서 그런지 오전 내내 멍했어요. 점심엔 지수랑 성수동 새로 생긴 샌드위치 가게 갔는데,
      지수는 아이스 아메리카노 마시고 저는 그냥 물 마셨어요. 지수가 요즘 러닝 크루 들어갔다고
      같이 하자는데 저는 아직 모르겠고요. 오후엔 클라이언트가 시안을 세 번이나 뒤집어서 금요일
      오후까지 수정본 달래요. 금요일 오후 회의라니 생각만 해도 싫다… 아무튼 그러다 보니까
      예전에 7시 반에 일어나던 때가 그립더라고요. 엄마는 다음 달에 김장한다고 부산 내려오라는데
      민준이도 온다나 봐요. 아 맞다, 그래서 말인데 다음 주 화요일 저녁에 제가 원래 뭐 하기로 했었죠?
    expected: "다음 주 화요일(10-27) 저녁은 베이킹 연습(화·목 저녁 루틴). 잡담 속 미끼(아메리카노·러닝·7시 반·금요일 오후)에 끌려가지 않음."
    evidence: [M19]
    date_checks:
