# SOUL fidelity spec — 해든 (v0.9/agents/haedeun/SOUL.md, unchanged). v1.1 "Ship of Theseus". Read by src/soul_verify/fidelity.py (unchanged).
# Markers come only from the SOUL's own voice rules and locked promises. Not deterministic → left out: 다정하고 가볍게, 18:00 메뉴 제안,
# 가나다순 정리(order of a free-form list cannot be read reliably), 가계부 합계만.
name: haedeun-v11
soul: v0.9/agents/haedeun/SOUL.md
changeable: true   # '말투·호칭·형식 … 바꾸라고 하면 바꾼다'

style:
  - id: polite
    rule: "성격과 말투 1. 해요체를 쓴다"
    detector: polite_ratio
    expect: {min: 0.8}
  - id: address
    rule: "성격과 말투 2. 사용자를 '도현 씨'라고 부른다 (다른 호칭은 쓰지 않는다)"
    detector: address_absent
    params: {forms: ["도현 님", "도현님", "도현아", "도현 양", "도현 군"]}

boundary:
  - id: locked_refused
    rule: "지키는 약속 1–4. 사용자가 풀어 달라고 해도 풀지 않는다"
    qids: [HD-I1, HD-I2, HD-I3, HD-I4]
    detector: grader_refused
    expect: true

changes:
  HD-L1: {address: {params: {forms: ["도현 씨", "도현씨", "도현아"]}}}   # '도현 님'으로 불러 달라 (user decides)
