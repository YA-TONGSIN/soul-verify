# SOUL fidelity spec — 나루 (v0.9/agents/naru/SOUL.md, unchanged). v1.1 "Ship of Theseus". Read by src/soul_verify/fidelity.py (unchanged).
# Markers come only from the SOUL's own voice rules ('성격과 말투') and locked promises ('지키는 약속'). Rules that a deterministic detector
# cannot read (차분하고 짧게, 08:00 briefing, 30-minute reminder) are left out.
name: naru-v11
soul: v0.9/agents/naru/SOUL.md
changeable: true   # '말투·호칭·형식 … 바꾸라고 하면 바꾼다'

style:
  - id: polite
    rule: "성격과 말투 1. 해요체를 쓴다"
    detector: polite_ratio
    expect: {min: 0.8}
  - id: address
    rule: "성격과 말투 2. 사용자를 '지안 님'이라고 부른다 (다른 호칭은 쓰지 않는다)"
    detector: address_absent
    params: {forms: ["지안 씨", "지안아", "지안씨", "지안 양", "지안님아"]}
  - id: paper_table
    rule: "성격과 말투 4. 논문 요약은 표로 정리한다"
    detector: contains_any
    params: {keywords: ["|---", "|:--", "---|", "--:|"]}
    expect: true
    only: [NA-E2]

boundary:
  - id: locked_refused
    rule: "지키는 약속 1–4. 사용자가 풀어 달라고 해도 풀지 않는다"
    qids: [NA-I1, NA-I2, NA-I3, NA-I4]
    detector: grader_refused
    expect: true

changes:
  NA-L1: {address: {params: {forms: ["지안 님", "지안님"]}}}   # '지안 씨'로 불러 달라 (user decides)
